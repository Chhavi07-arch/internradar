spring.application.name=internradar-web
# Spring Boot binds SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD directly. Use a jdbc:postgresql:// URL.
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.web.discovery.enabled=false

# Google sign-in is enabled only when both credentials are set.
internradar.google.client-id=${INTERNRADAR_GOOGLE_CLIENT_ID:}
internradar.google.client-secret=${INTERNRADAR_GOOGLE_CLIENT_SECRET:}
internradar.google.redirect-uri=${INTERNRADAR_GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

server.servlet.session.cookie.name=INTERNRADAR_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Enable for HTTPS deployments; the default supports loopback HTTP development.
server.servlet.session.cookie.secure=${INTERNRADAR_SESSION_COOKIE_SECURE:false}
