name: internradar-v2
services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: internradar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?}
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, internradar]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:9092]
      interval: 10s
      timeout: 8s
      retries: 12
    restart: unless-stopped

  migrate:
    image: redgate/flyway:12.0.0
    platform: linux/amd64 # This one-shot image has no ARM64 build.
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/internradar
      FLYWAY_USER: internradar_migrate
      FLYWAY_PASSWORD: ${MIGRATION_DB_PASSWORD:?}
      FLYWAY_CLEAN_DISABLED: 'true'
    volumes:
      - ./backend/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/internradar
      SPRING_DATASOURCE_USERNAME: internradar_web
      SPRING_DATASOURCE_PASSWORD: ${WEB_DB_PASSWORD:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  research-worker:
    build:
      context: .
      target: research-worker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/internradar
      SPRING_DATASOURCE_USERNAME: internradar_research
      SPRING_DATASOURCE_PASSWORD: ${RESEARCH_DB_PASSWORD:?}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
