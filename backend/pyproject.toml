[project]
name = "internradar"
version = "0.1.0"
description = "One dashboard for every internship: college mail, personal mail, job boards and company career pages."
authors = [
    { name = "Chhavi07-arch" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
    "typer>=0.15",
    "rich>=13.9",
    "python-jobspy>=1.4.1",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.6",
    "anthropic>=2.10.0",
    "google-auth-oauthlib>=1.5.0",
    "openai>=3.57.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "cryptography>=50.0.2",
    "authlib>=1.9.10",
    "itsdangerous>=2.2.0",
]

[project.scripts]
internradar = "internradar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Headlines and job titles use typographic quotes; matching them is intentional.
allowed-confusables = ["’", "‘", "“", "”"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
